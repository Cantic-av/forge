<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>FORGE</title>
<meta name="theme-color" content="#0B1220">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORGE">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<style>
  :root{
    --bg:#0A1018;--bg2:rgba(255,255,255,.06);--card:rgba(255,255,255,.055);--cardHi:rgba(255,255,255,.10);
    --line:rgba(255,255,255,.10);--glassB:rgba(255,255,255,.13);
    --gold:#C9A24A;--goldSoft:#E3C272;--steel:#6E8DBA;--text:#F4F1E9;--mut:#97A1B6;--green:#5FB890;--red:#E0908F;
    --safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);--nav:78px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{background:var(--bg);color:var(--text);font-family:'Hanken Grotesk',ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  body{min-height:100vh;min-height:100dvh;position:relative;}
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
    radial-gradient(55% 45% at 12% -5%,rgba(201,162,74,.14),transparent 60%),
    radial-gradient(65% 55% at 105% 12%,rgba(110,141,186,.16),transparent 62%),
    radial-gradient(120% 90% at 50% 118%,rgba(201,162,74,.08),transparent 70%),var(--bg);}
  input,select{font-family:inherit;}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;}
  input[type=number]{-moz-appearance:textfield;}
  ::selection{background:var(--gold);color:var(--bg);}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  svg{display:block;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @keyframes sheetUp{from{transform:translateY(100%);}to{transform:none;}}
  .wrap{max-width:520px;margin:0 auto;padding-bottom:calc(var(--nav) + var(--safeB) + 46px);}
  .wrap.session{padding-bottom:calc(108px + var(--safeB));}
  .pad{padding-left:24px;padding-right:24px;}
  .fade{animation:fadeUp .4s cubic-bezier(.2,.8,.2,1) both;}
  .still .fade,.sheet.still{animation:none;}
  .row{display:flex;align-items:center;}
  .between{justify-content:space-between;}
  .mut{color:var(--mut);}.gold{color:var(--gold);}.goldS{color:var(--goldSoft);}
  .xs{font-size:13.5px;}.sm{font-size:15.5px;}.lg{font-size:21.5px;}.xl{font-size:27px;}
  .b6{font-weight:600;}.b7{font-weight:700;}.b8{font-weight:800;}
  .up{text-transform:uppercase;letter-spacing:.08em;}
  .tab{font-variant-numeric:tabular-nums;}
  .cap{text-transform:capitalize;}
  .card{background:var(--card);border:1px solid var(--glassB);border-radius:26px;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 12px 30px rgba(0,0,0,.30);}
  .badge{border:1px solid var(--line);border-radius:11px;padding:4px 10px;}
  .top{padding-top:calc(32px + var(--safeT));}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand h1{font-weight:800;letter-spacing:.14em;font-size:26px;}
  .ghost{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--glassB);color:var(--mut);border-radius:17px;padding:12px 17px;font-size:13.5px;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px;}
  .stat{background:var(--card);border:1px solid var(--glassB);border-radius:23px;padding:17px;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 12px 30px rgba(0,0,0,.28);}
  .stat .v{font-weight:800;font-size:26px;}
  .scard{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--glassB);border-radius:26px;padding:20px;transition:.18s;box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 12px 30px rgba(0,0,0,.28);}
  .scard.hi{background:linear-gradient(180deg,rgba(201,162,74,.20),rgba(201,162,74,.07));border-color:rgba(201,162,74,.55);box-shadow:0 1px 0 rgba(255,255,255,.10) inset,0 14px 34px rgba(201,162,74,.14);}
  .chip{display:flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:17px;background:var(--bg2);color:var(--gold);font-weight:800;font-size:19px;}
  .scard.hi .chip{background:var(--gold);color:#1a1407;}
  .label{color:var(--mut);font-size:13.5px;text-transform:uppercase;letter-spacing:.09em;margin:28px 0 10px;}
  .stack{display:flex;flex-direction:column;gap:14px;}
  .deload{margin-top:20px;padding:19px;border-radius:24px;background:linear-gradient(180deg,rgba(227,194,114,.16),rgba(227,194,114,.05));border:1px solid rgba(227,194,114,.42);display:flex;gap:13px;align-items:flex-start;}
  .deload .btn{margin-top:12px;background:var(--goldSoft);color:#1a1407;font-weight:700;border-radius:999px;padding:9px 18px;font-size:13.5px;}
  .shead{position:sticky;top:0;z-index:30;background:rgba(10,16,24,.72);box-shadow:0 14px 22px -16px rgba(0,0,0,.7);padding:calc(28px + var(--safeT)) 24px 15px;backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);}
  .prog{margin-top:14px;height:8px;border-radius:999px;background:rgba(0,0,0,.25);overflow:hidden;}
  .prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--goldSoft));width:0%;transition:width .35s;}
  .ex{background:var(--card);border:1px solid var(--glassB);border-radius:24px;overflow:hidden;box-shadow:0 12px 28px rgba(0,0,0,.26);}
  .ex .h{padding:19px 19px 14px;}
  .ex h3{font-weight:700;font-size:16.5px;line-height:1.35;}
  .restbtn{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--mut);border:1px solid var(--line);border-radius:999px;padding:6px 13px;margin-left:auto;}
  .note{color:var(--mut);background:rgba(0,0,0,.20);font-size:13.5px;margin-top:10px;padding:13px;border-radius:13px;line-height:1.55;}
  .setrow{display:flex;align-items:center;gap:10px;padding:14px 19px;border-top:1px solid var(--line);}
  .field{display:flex;align-items:center;gap:5px;padding:11px 13px;border-radius:14px;background:rgba(0,0,0,.22);border:1px solid var(--line);width:96px;}
  .field input{background:transparent;color:var(--text);width:100%;outline:none;border:none;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;}
  .check{margin-left:auto;display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;background:rgba(0,0,0,.20);border:1px solid var(--line);color:var(--mut);transition:.15s;}
  .check.done{background:var(--green);border-color:var(--green);color:#04130c;}
  .finish{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:16px 24px calc(16px + var(--safeB));background:rgba(10,16,24,.72);border-top:1px solid var(--line);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);}
  .finish .inner{max-width:520px;margin:0 auto;}
  .finish button{width:100%;padding:18px;border-radius:19px;background:linear-gradient(180deg,#D8B25E,#C9A24A);color:#1a1407;font-weight:800;letter-spacing:.02em;font-size:16.5px;box-shadow:0 6px 18px rgba(201,162,74,.30),0 1px 0 rgba(255,255,255,.4) inset;}
  .hentry{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--glassB);border-radius:24px;padding:19px;box-shadow:0 12px 28px rgba(0,0,0,.26);}
  .chartbox{margin-top:20px;padding:19px;border-radius:24px;background:var(--card);border:1px solid var(--glassB);}
  .seg{display:flex;gap:5px;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:18px;padding:6px;margin-top:22px;}
  .seg button{flex:1;padding:14px;border-radius:14px;font-size:15.5px;font-weight:600;color:var(--mut);transition:.15s;}
  .seg button.on{background:var(--cardHi);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.10) inset,0 4px 12px rgba(0,0,0,.25);}
  .rings{display:flex;gap:15px;margin-top:20px;}
  .ringcard{flex:1;background:var(--card);border:1px solid var(--glassB);border-radius:24px;padding:18px;display:flex;flex-direction:column;align-items:center;box-shadow:0 12px 28px rgba(0,0,0,.26);}
  .ringwrap{position:relative;width:108px;height:108px;}
  .ringval{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ringval b{font-size:25px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;}
  .ringval span{font-size:12.5px;color:var(--mut);margin-top:3px;}
  .datenav{display:flex;align-items:center;justify-content:space-between;margin-top:22px;background:var(--card);border:1px solid var(--glassB);border-radius:18px;padding:10px 13px;}
  .datenav button{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:var(--mut);}
  .datenav button:disabled{opacity:.3;}
  .li{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--glassB);border-radius:22px;padding:18px;box-shadow:0 10px 24px rgba(0,0,0,.22);}
  .li .x{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--mut);border:1px solid var(--line);flex:none;margin-left:12px;}
  .iconbtn{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);color:var(--mut);background:rgba(0,0,0,.16);}
  .addbtn{width:100%;padding:18px;border-radius:19px;border:1px dashed var(--glassB);color:var(--goldSoft);font-weight:600;font-size:15.5px;display:flex;align-items:center;justify-content:center;gap:9px;background:rgba(255,255,255,.04);}
  .linkbtn{font-size:13.5px;color:var(--mut);text-decoration:underline;text-underline-offset:2px;}
  .supp{display:flex;align-items:flex-start;gap:13px;background:var(--card);border:1px solid var(--glassB);border-radius:22px;padding:16px 18px;box-shadow:0 10px 24px rgba(0,0,0,.22);}
  .sbox{flex:none;width:33px;height:33px;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.20);display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .sbox.on{background:var(--green);border-color:var(--green);}
  .train-tag{font-size:11px;color:var(--goldSoft);border:1px solid var(--line);border-radius:7px;padding:2px 7px;margin-left:7px;vertical-align:middle;}
  #modal.show{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:rgba(3,7,15,0);}
  .sheet{width:100%;max-width:520px;background:rgba(18,28,46,.82);border:1px solid var(--glassB);border-bottom:none;border-radius:30px 30px 0 0;padding:22px 22px calc(22px + var(--safeB));max-height:88vh;will-change:transform;overflow-y:auto;backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:0 -10px 40px rgba(0,0,0,.45);}
  .sheet h3{font-weight:800;font-size:18.5px;}
  .mfield{display:flex;flex-direction:column;gap:6px;}
  .mfield label{font-size:12.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;}
  .mfield input,.mfield select{background:rgba(0,0,0,.24);border:1px solid var(--line);border-radius:14px;padding:14px 15px;color:var(--text);font-size:17px;outline:none;}
  .mfield input:focus,.mfield select:focus{border-color:var(--gold);}
  .primary{width:100%;padding:17px;border-radius:17px;background:linear-gradient(180deg,#D8B25E,#C9A24A);color:#1a1407;font-weight:800;font-size:16.5px;box-shadow:0 6px 18px rgba(201,162,74,.30),0 1px 0 rgba(255,255,255,.4) inset;}
  .stepper{display:flex;align-items:center;gap:18px;justify-content:center;}
  .stepper button{width:58px;height:58px;border-radius:18px;background:var(--cardHi);border:1px solid var(--glassB);font-size:29px;font-weight:700;color:var(--goldSoft);}
  .stepper .q{font-size:34px;font-weight:800;min-width:72px;text-align:center;font-variant-numeric:tabular-nums;}
  .foodrow{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--glassB);border-radius:17px;padding:15px 16px;}
  .nav{position:fixed;left:14px;right:14px;bottom:calc(10px + var(--safeB));z-index:55;background:rgba(16,26,44,.72);border:1px solid var(--glassB);border-radius:32px;backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:0 12px 36px rgba(0,0,0,.42),0 1px 0 rgba(255,255,255,.08) inset;}
  .nav .inner{max-width:520px;margin:0 auto;height:var(--nav);display:flex;padding:9px 7px;}
  .nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--mut);font-size:11.5px;font-weight:600;border-radius:24px;margin:0 5px;transition:.18s;}
  .nav button.on{color:var(--gold);background:rgba(201,162,74,.15);}
  .pill{position:fixed;left:0;right:0;display:flex;justify-content:center;z-index:70;}
  .pill .inner{display:flex;align-items:center;gap:14px;padding:11px 19px;border-radius:999px;background:rgba(24,41,74,.82);border:1px solid var(--glassB);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);box-shadow:0 10px 34px rgba(0,0,0,.5);}
  .pill .t{font-weight:700;font-variant-numeric:tabular-nums;min-width:48px;font-size:16px;}
  .pill .add{font-size:13.5px;color:var(--gold);border:1px solid var(--line);border-radius:999px;padding:6px 11px;}
  .pill .inner.done{background:rgba(20,64,46,.88);border-color:rgba(95,184,144,.55);animation:restPulse 1.15s ease-in-out infinite;}
  .pill .inner.done .t{color:var(--green);}
  .pill .inner.done .add{color:#04130c;background:var(--green);border-color:var(--green);font-weight:700;}
  @keyframes restPulse{0%,100%{box-shadow:0 10px 34px rgba(0,0,0,.5);}50%{box-shadow:0 10px 34px rgba(0,0,0,.5),0 0 0 5px rgba(95,184,144,.22);}}
  #toast{position:fixed;left:0;right:0;bottom:calc(var(--nav) + var(--safeB) + 30px);display:flex;justify-content:center;z-index:90;}
  #toast .inner{padding:11px 19px;border-radius:999px;background:var(--green);color:#04130c;font-weight:600;font-size:15.5px;box-shadow:0 8px 24px rgba(0,0,0,.35);}
  .hidden{display:none;}
  .target{margin-top:10px;padding:11px 13px;border-radius:13px;background:rgba(110,141,186,.12);border:1px solid rgba(110,141,186,.28);display:flex;flex-direction:column;gap:3px;}
  .target b{font-size:15.5px;font-variant-numeric:tabular-nums;}
  .target span{font-size:12.5px;color:var(--mut);}
  .target.up{background:rgba(95,184,144,.12);border-color:rgba(95,184,144,.36);}.target.up b{color:var(--green);}
  .target.down{background:rgba(224,144,143,.10);border-color:rgba(224,144,143,.32);}
  .pairlbl{display:flex;align-items:center;gap:8px;color:var(--steel);font-size:12.5px;font-weight:600;letter-spacing:.04em;margin:6px 4px -4px;}
  .ex.paired{border-color:rgba(110,141,186,.38);}
  .setrow.warm{background:rgba(110,141,186,.06);}
  .setrow.warm input{color:var(--mut);}
  /* --- apple-design : réponse immédiate au toucher --- */
  button{transition:transform .12s ease-out,background-color .18s,color .18s,border-color .18s,opacity .18s;}
  button:active{transform:scale(.97);}
  .nav button:active{transform:scale(.92);}
  .check:active,.sbox:active,.stepper button:active,.iconbtn:active,.li .x:active{transform:scale(.88);}
  button:disabled:active{transform:none;}
  .check.pop,.sbox.pop{animation:pop .32s cubic-bezier(.34,1.5,.64,1);}
  @keyframes pop{0%{transform:scale(.86);}100%{transform:none;}}
  /* fenêtre du bas : poignée, ressort piloté en JS */
  .grab{touch-action:none;margin:-22px -22px 8px;padding:10px 0 14px;display:flex;justify-content:center;cursor:grab;}
  .grab i{display:block;width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.28);}
  /* toast et minuteur : entrent et sortent par le même chemin */
  #toast .inner,.pill .inner{transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .25s;}
  #toast.off .inner,.pill.off .inner{transform:translateY(24px) scale(.96);opacity:0;}
  #toast .inner{display:flex;align-items:center;gap:14px;}
  #toast .undo{color:#04130c;font-weight:800;text-decoration:underline;text-underline-offset:2px;}
  /* accessibilité : réglages iPhone */
  @media (prefers-reduced-motion: reduce){
    .fade,.check.pop,.sbox.pop,.pill .inner.done{animation:none !important;}
    button,#toast .inner,.pill .inner{transition:opacity .2s !important;}
    button:active{transform:none;}
    #toast.off .inner,.pill.off .inner{transform:none;}
  }
  @media (prefers-reduced-transparency: reduce){
    .nav,.shead,.finish,.sheet,.pill .inner{backdrop-filter:none !important;-webkit-backdrop-filter:none !important;}
    .nav{background:#121d31;}.shead,.finish{background:#0B1220;}.sheet{background:#141f33;}
  }
  @media (prefers-contrast: more){
    :root{--glassB:rgba(255,255,255,.36);--line:rgba(255,255,255,.28);--mut:#C6CDDB;}
  }
  .caveat{font-size:12.5px;color:var(--mut);line-height:1.6;margin-top:20px;padding:15px;background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:14px;}
</style>
</head>
<body>
  <div id="app"></div>
  <div id="modal"></div>
  <div id="pill" class="pill hidden"></div>
  <div id="toast" class="hidden"></div>
<script>
/* ===== PROGRAM ===== */
const PROGRAM={
  A:{id:"A",name:"Haut du corps",tag:"Upper",groups:"Pecs · Dos · Épaules · Bras",ex:[
    {n:"Développé incliné haltères",s:4,r:"8–10",rest:"90 s",note:"Haltères = trajectoire libre, épaule protégée. Ne descends pas les coudes sous la ligne du torse."},
    {n:"Tirage vertical poitrine",s:4,r:"8–10",rest:"90 s",note:"Prise large. Superset possible avec le développé incliné."},
    {n:"Développé machine convergente",s:3,r:"10–12",rest:"75 s",note:"Machine = sûre pour l'épaule, tu peux pousser près de l'échec."},
    {n:"Rowing buste soutenu",s:3,r:"10–12",rest:"75 s",note:"Buste SOUTENU obligatoire — jamais buste penché barre libre (dos)."},
    {n:"Curl barre EZ",s:3,r:"10–12",rest:"60 s",note:"Point faible → on charge sérieusement."},
    {n:"Extension triceps poulie",s:3,r:"10–12",rest:"60 s",note:"Superset possible avec le curl."},
    {n:"Crunch à la poulie",s:3,r:"12–15",rest:"45 s",note:"Abdos — point faible, présent à chaque séance."}]},
  B:{id:"B",name:"Bas du corps",tag:"Lower",groups:"Quadri · Ischios · Mollets · Abdos",ex:[
    {n:"Presse à cuisses",s:4,r:"10–12",rest:"2 min",note:"Ton mouvement préféré, et le plus sûr pour le dos : le dossier soutient le lombaire."},
    {n:"Hack squat machine",s:3,r:"10–12",rest:"2 min",note:"Remplace le squat barre. Jamais barre libre lourde."},
    {n:"Leg curl (allongé ou assis)",s:4,r:"10–12",rest:"90 s",note:"Ischios sans deadlift ni soulevé roumain — indispensable vu ton dos."},
    {n:"Extension mollets",s:4,r:"12–15",rest:"45 s",note:"Amplitude complète, pause en bas."},
    {n:"Face pull",s:3,r:"15",rest:"45 s",note:"Santé épaule + arrière d'épaule et trapèzes. À garder à vie."},
    {n:"Relevés de jambes + planche",s:3,r:"12–15",rest:"45 s",note:"Abdos. Pas de crunch lesté lourd ici (dos)."}]},
  C:{id:"C",name:"Full body",tag:"Rappel",groups:"Corps entier + pecs/biceps",ex:[
    {n:"Presse à cuisses",s:3,r:"12",rest:"90 s",note:"Rappel jambes."},
    {n:"Rowing machine assise",s:3,r:"10–12",rest:"75 s",note:"Dos neutre, gainé."},
    {n:"Développé couché machine",s:4,r:"10–12",rest:"75 s",note:"2ᵉ dose pecs — point faible."},
    {n:"Curl incliné haltères",s:4,r:"10–12",rest:"60 s",note:"2ᵉ dose biceps — point faible. Superset possible avec le développé."},
    {n:"Élévations latérales poulie",s:3,r:"12–15",rest:"45 s",note:"Léger, prudence épaule."},
    {n:"Crunch + obliques",s:3,r:"15",rest:"45 s",note:"Abdos."}]},

let pillT=null;
function stopRest(){if(S.restTimer)clearInterval(S.restTimer);S.restTimer=null;S.restEnd=null;S.restDone=false;pill.classList.add("off");clearTimeout(pillT);pillT=setTimeout(()=>{if(S.restEnd==null)pill.classList.add("hidden");},320);}
function showPill(){const inSession=(S.tab==="train"&&S.trainView==="session");const bottom=(inSession?100:104)+parseInt(C("--safeB")||0);pill.style.bottom=bottom+"px";if(S.restDone){pill.innerHTML='<div class="inner done">'+I.check(C("--green"))+'<span class="t">Repos terminé</span><button class="add" data-act="rest-close">OK</button></div>';}else{pill.innerHTML='<div class="inner">'+I.timer(C("--gold"))+'<span class="t">'+mmss(restRemaining())+'</span><button class="add" data-act="rest-add">+30 s</button><button data-act="rest-close">'+I.x(C("--mut"))+'</button></div>';}clearTimeout(pillT);if(pill.classList.contains("hidden")){pill.classList.remove("hidden");pill.classList.add("off");void pill.offsetWidth;}pill.classList.remove("off");}
let toastT=null;
let toastUndo=null;
function toast(m,undo){const t=document.getElementById("toast");toastUndo=undo||null;t.innerHTML='<div class="inner">'+m+(undo?'<button class="undo" data-act="undo">Annuler</button>':"")+'</div>';t.classList.remove("hidden");t.classList.add("off");void t.offsetWidth;t.classList.remove("off");clearTimeout(toastT);toastT=setTimeout(()=>{t.classList.add("off");toastT=setTimeout(()=>{t.classList.add("hidden");toastUndo=null;},320);},undo?4000:2200);}
document.getElementById("toast").addEventListener("click",e=>{if(e.target.closest("[data-act=undo]")&&toastUndo){const u=toastUndo;toastUndo=null;u();const t=document.getElementById("toast");clearTimeout(toastT);t.classList.add("off");toastT=setTimeout(()=>t.classList.add("hidden"),320);}});
/* ===== backup (export / import JSON) ===== */
const BACKUP_KEYS=[KL,KD,KA,KT,KN,KF,KSU,KM,KSV];
function exportData(){
  const data={};BACKUP_KEYS.forEach(k=>{const v=localStorage.getItem(k);if(v!==null)data[k]=v;});
  const payload={app:"FORGE",schema:1,exportedAt:new Date().toISOString(),data};
  const json=JSON.stringify(payload,null,2),fname="forge-backup-"+isoToday()+".json";
  const blob=new Blob([json],{type:"application/json"});
  try{
    const file=new File([blob],fname,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:"Sauvegarde FORGE"}).then(()=>toast("Sauvegarde exportée ✓")).catch(()=>{});
      return;
    }
  }catch(e){}
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Sauvegarde exportée ✓");
}
function importData(file){
  const reader=new FileReader();
  reader.onload=()=>{
    let payload;try{payload=JSON.parse(reader.result);}catch(e){toast("Fichier illisible");return;}
    if(!payload||payload.app!=="FORGE"||!payload.data){toast("Fichier FORGE invalide");return;}
    const keys=Object.keys(payload.data).filter(k=>BACKUP_KEYS.includes(k));
    if(!keys.length){toast("Aucune donnée FORGE dans ce fichier");return;}
    if(!confirm("Remplacer tes données actuelles par cette sauvegarde ("+keys.length+" éléments) ? Ton état actuel sera écrasé.")) return;
    keys.forEach(k=>{try{localStorage.setItem(k,typeof payload.data[k]==="string"?payload.data[k]:JSON.stringify(payload.data[k]));}catch(e){}});
    toast("Sauvegarde importée ✓");setTimeout(()=>location.reload(),700);
  };
  reader.readAsText(file);
}
function pickImportFile(){
  const inp=document.createElement("input");inp.type="file";inp.accept="application/json,.json";
  inp.onchange=()=>{if(inp.files&&inp.files[0])importData(inp.files[0]);};inp.click();
}
/* ===== events: page ===== */
app.addEventListener("input",e=>{const t=e.target;if(t.dataset&&t.dataset.field!==undefined)S.active.sets[+t.dataset.ex][+t.dataset.set][t.dataset.field]=t.value;});
app.addEventListener("change",e=>{if(e.target.dataset&&e.target.dataset.field!==undefined)save(KA,S.active);});
app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;
  if(a==="tab"){S.tab=b.dataset.tab;if(S.tab==="nutri")S.foodsOpen=false;render();return;}
  if(a==="tview"){S.trainView=b.dataset.v;render();return;}
  if(a==="start"){startSession(b.dataset.id);return;}
  if(a==="deload"){deload=logs.length;save(KD,deload);render();toast("Deload validé — compteur remis à zéro");return;}
  if(a==="quit"){save(KA,S.active);S.active=null;save(KA,null);S.trainView="home";render();return;}
  if(a==="finish"){finishSession();return;}
  if(a==="reset-train"){if(confirm("Effacer tout l'historique d'entraînement ?")){logs=[];deload=0;save(KL,logs);save(KD,0);S.trainView="home";render();toast("Entraînement réinitialisé");}return;}
  if(a==="open-train"){S.detail=logs.find(l=>l.id==b.dataset.id);S.trainView="detail";render();return;}
  if(a==="note"){const n=document.getElementById("note-"+b.dataset.ex);if(n)n.classList.toggle("hidden");return;}
  if(a==="rest"){startRest(+b.dataset.sec);return;}
  if(a==="legacy"){S.showLegacy=!S.showLegacy;render();return;}
  if(a==="add-warm"){const ei=+b.dataset.ex,first=S.active.sets[ei].find(r=>!r.warm),w=first&&first.weight!==""?String(Math.round(num(first.weight)*.6/2.5)*2.5):"";S.active.sets[ei].unshift({weight:w,reps:"",done:false,warm:true});save(KA,S.active);render();return;}
  if(a==="del-warm"){S.active.sets[+b.dataset.ex].splice(+b.dataset.set,1);save(KA,S.active);render();return;}
  if(a==="swap"){modalSwap(+b.dataset.ex);return;}
  if(a==="toggle"){const ei=+b.dataset.ex,si=+b.dataset.set,row=S.active.sets[ei][si];row.done=!row.done;
    if(row.done&&row.reps===""){const pex=PROGRAM[S.active.sessionId].ex[ei],sg=suggest(pex,(S.active.names||[])[ei]||pex.n);if(sg.reps!==""){row.reps=String(sg.reps);const inp=document.querySelector('input[data-ex="'+ei+'"][data-set="'+si+'"][data-field="reps"]');if(inp)inp.value=row.reps;}}
    if(row.done&&!row.warm)adaptAfterSet(ei,si);
    if(row.done){const exs=PROGRAM[S.active.sessionId].ex,pex=exs[ei],nx=exs[ei+1];if(!(pex.pair&&nx&&nx.pair===pex.pair))startRest(parseRest(pex.rest));}save(KA,S.active);b.classList.toggle("done",row.done);b.classList.toggle("pop",row.done);b.innerHTML=I.check(row.done?"#04130c":C("--mut"));updateProgress();return;}
  if(a==="nsub"){S.nutriSub=b.dataset.sub;S.foodsOpen=false;render();return;}
  if(a==="ndate"){const ni=addISO(S.nutriDate,+b.dataset.dir);if(ni<=isoToday())S.nutriDate=ni;render();return;}
  if(a==="open-target"){modalTarget();return;}
  if(a==="open-picker"){S.pickFood=null;S.pickQty=1;modalPicker();return;}
  if(a==="open-foods"){S.foodsOpen=true;render();return;}
  if(a==="close-foods"){S.foodsOpen=false;render();return;}
  if(a==="open-addfood"){modalAddFood(null);return;}
  if(a==="edit-food"){modalAddFood(b.dataset.id);return;}
  if(a==="del-food"){if(confirm("Supprimer cet aliment de ta bibliothèque ?")){foods=foods.filter(x=>x.id!==b.dataset.id);save(KF,foods);render();}return;}
  if(a==="del-log"){const day=S.nutriDate,before=[...dayEntries()],arr=[...before],gone=arr.splice(+b.dataset.i,1)[0];nutriLog[day]=arr;save(KN,nutriLog);render();toast(esc(gone.name).slice(0,28)+" retiré",()=>{nutriLog[day]=before;save(KN,nutriLog);render();});return;}
  if(a==="supp"){const st=load(KSU,{date:"",ids:[]});let ids=(st.date===isoToday())?st.ids.slice():[];const id=b.dataset.id,i=ids.indexOf(id);if(i>=0)ids.splice(i,1);else ids.push(id);save(KSU,{date:isoToday(),ids});render();return;}
  if(a==="supp-note"){const n=document.getElementById("snote-"+b.dataset.id);if(n)n.classList.toggle("hidden");return;}
  if(a==="open-metric"){S.measureSel=b.dataset.id;S.measureView="detail";render();return;}
  if(a==="mback"){S.measureView="list";S.measureSel=null;render();return;}
  if(a==="open-logm"){modalLogMeasure();return;}
  if(a==="log-photo"){const m=measures.find(x=>x.id===S.measureSel),d=isoToday();m.history=(m.history||[]).filter(e=>e.date!==d).concat([{date:d}]);m.history.sort((x,y)=>x.date<y.date?-1:1);save(KM,measures);render();toast("Photos notées ✓");return;}
  if(a==="del-metric"){if(confirm("Supprimer cette mesure et son historique ?")){measures=measures.filter(x=>x.id!==b.dataset.id);save(KM,measures);S.measureView="list";S.measureSel=null;render();}return;}
  if(a==="open-addmetric"){modalAddMetric();return;}
  if(a==="export-data"){exportData();return;}
  if(a==="import-data"){pickImportFile();return;}
});
/* ===== events: modal ===== */
modalEl.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");
  if(!b){if(!e.target.closest("[data-stop]"))closeModal();return;}
  const a=b.dataset.act;
  if(a==="modal-close"){closeModal();return;}
  if(a==="do-swap"){const ei=+b.dataset.ex,n=b.dataset.n,ex=PROGRAM[S.active.sessionId].ex[ei];if(!S.active.names)S.active.names=PROGRAM[S.active.sessionId].ex.map(e=>e.n);S.active.names[ei]=n;const sg=suggest(ex,n);S.active.sets[ei].forEach(r=>{if(!r.warm&&!r.done)r.weight=sg.w===""?"":String(sg.w);});save(KA,S.active);closeModal();render();return;}
  if(a==="pick"){S.pickFood=b.dataset.id;S.pickQty=1;modalPicker();return;}
  if(a==="pick-back"){S.pickFood=null;modalPicker();return;}
  if(a==="qty"){S.pickQty=Math.max(0.5,r1(S.pickQty+parseFloat(b.dataset.d)));S.keepSheetScroll=true;modalPicker();return;}
  if(a==="add-logged"){const f=foods.find(x=>x.id===S.pickFood);addLogged(f,S.pickQty);closeModal();render();toast("Ajouté ✓");return;}
  if(a==="open-custom"){modalCustom();return;}
  if(a==="add-custom"){const name=(document.getElementById("c-name").value||"").trim()||"Aliment";addLogged({name,kcal:num(document.getElementById("c-kcal").value),p:num(document.getElementById("c-p").value),c:num(document.getElementById("c-c").value),f:num(document.getElementById("c-f").value)},1);closeModal();render();toast("Ajouté ✓");return;}
  if(a==="save-target"){targets={protein:Math.max(0,parseInt(document.getElementById("t-prot").value)||TARGET_DEFAULT.protein),kcal:Math.max(0,parseInt(document.getElementById("t-kcal").value)||TARGET_DEFAULT.kcal)};save(KT,targets);closeModal();render();toast("Objectifs mis à jour");return;}
  if(a==="save-food"){const id=document.getElementById("f-id").value;const obj={name:(document.getElementById("f-name").value||"").trim()||"Aliment",unit:(document.getElementById("f-unit").value||"").trim()||"unité",kcal:num(document.getElementById("f-kcal").value),p:num(document.getElementById("f-p").value),c:num(document.getElementById("f-c").value),f:num(document.getElementById("f-f").value)};if(id){const i=foods.findIndex(x=>x.id===id);if(i>=0)foods[i]={...foods[i],...obj};}else{foods.push({id:"f"+Date.now(),...obj});}save(KF,foods);closeModal();S.foodsOpen=true;render();toast("Aliment enregistré");return;}
  if(a==="save-logm"){const m=measures.find(x=>x.id===S.measureSel),v=num(document.getElementById("m-val").value),d=document.getElementById("m-date").value||isoToday();if(v>0){m.history=(m.history||[]).filter(e=>e.date!==d).concat([{date:d,value:v}]);m.history.sort((x,y)=>x.date<y.date?-1:1);save(KM,measures);closeModal();render();toast("Mesure enregistrée ✓");}else closeModal();return;}
  if(a==="save-metric"){const name=(document.getElementById("nm-name").value||"").trim();if(name){measures.push({id:"m"+Date.now(),name,unit:(document.getElementById("nm-unit").value||"").trim(),freq:parseInt(document.getElementById("nm-freq").value)||14,history:[]});save(KM,measures);}closeModal();render();return;}
});
pill.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;if(a==="rest-add"){if(S.restEnd==null)return;S.restEnd+=30000;if(S.restDone){S.restDone=false;if(!S.restTimer)S.restTimer=setInterval(tickRest,1000);}showPill();}else if(a==="rest-close")stopRest();});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.restEnd!=null)tickRest();});
document.addEventListener("touchstart",()=>{},{passive:true});
document.addEventListener("animationend",e=>{if(e.target.classList&&e.target.classList.contains("pop"))e.target.classList.remove("pop");});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
render();
</script>
